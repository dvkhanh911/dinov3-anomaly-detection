# Auxiliary Unsupervised Segmentation Head + DINOv3 ConvNeXt-Base + PatchCore
# KolektorSDD single split (train = 50 good images, test = 52 defective + 297 good)

seed: 42
device: cuda  # or cpu

data:
  root: /content/drive/MyDrive/KolektorSDD  # local path to KolektorSDD (kos01..kos50)
  width: 512
  height: 1408
  train_good: 50

backbone:
  name: convnext_base.dinov3_lvd1689m
  out_indices: [1, 2]
  pretrained: true
  frozen: true

features:
  pool: 3
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

coreset:
  size: 10000
  proj_dim: 128
  batch_add: 128

scoring:
  neighbors: 9
  gauss_kernel: 17
  gauss_sigma: 4.0

segmentation:
  enabled: true
  in_channels: 768  # sum(feature_info.channels()) for stages.1 (256) + stages.2 (512)
  hidden_dim: 256
  num_classes: 1
  checkpoint: checkpoints/segmentation_head_best.pth

training:
  epochs: 20
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.0001

loss:
  pseudo_weight: 1.0
  consistency_weight: 0.1

pseudo_label:
  method: feature_clustering  # 'feature_clustering' (PCA / KMeans) or 'border_cosine'
  clustering_type: pca        # 'pca', 'kmeans', 'border_cosine'
  threshold: 0.5              # threshold for binarization, or null for soft labels
  soft_labels: true           # soft pseudo-labels preserve continuous confidence
  use_patchcore: true         # combine PatchCore spatial cues into pseudo-label
  patchcore_weight: 0.2
  spatial_smooth: true        # apply spatial smoothing to remove isolated patch noise
  smooth_sigma: 2.0

fusion:
  enabled: true
  alpha: 0.8  # residual baseline: alpha in [0, 1]. alpha=1.0 is exact baseline; alpha<1.0 attenuates background anomalies

metrics:
  pixel_width: 128
  pixel_height: 352
