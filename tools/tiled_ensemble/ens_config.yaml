seed: 42
accelerator: "cuda"
default_root_dir: "results"

tiling:
  # (height, width) convention. 1280x512 keeps Kolektor aspect (~500x1260):
  # (1280-256)/128+1=9 rows x (512-256)/128+1=3 cols = 27 overlapping tiles.
  image_size: [1280, 512]
  tile_size: [256, 256]
  stride: 128

normalization_stage: image # on what level we normalize, options: [tile, image, none]
thresholding_stage: image # stage at which we apply threshold, options: [tile, image]

data:
  class_path: anomalib.data.Kolektor
  init_args:
    root: ./datasets/kolektor
    train_batch_size: 32
    eval_batch_size: 32
    num_workers: 8
    train_augmentations: null
    val_augmentations: null
    test_augmentations: null
    augmentations: null
    test_split_mode: from_dir
    test_split_ratio: 0.2
    val_split_mode: same_as_test
    val_split_ratio: 0.5

SeamSmoothing:
  apply: True # if this is applied, area around tile seams are is smoothed
  sigma: 2 # sigma of gaussian filter used to smooth this area
  width: 0.1 # width factor, multiplied by tile dimension gives the region width around seam which will be smoothed

TrainModels:
  model:
    class_path: Padim
    init_args:
      backbone: convnext_base.dinov3_lvd1689m
      layers: [stages.1, stages.2, stages.3]
      pre_trained: true
      n_features: 512
